<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jarvis Bot</title>
    <style>
      :root {
        --bg: #0a0b0e;
        --card: #12151c;
        --text: #e8eaed;
        --muted: #6b7280;
        --line: rgba(255, 255, 255, 0.08);
        --accent: #8aa4c7;
        --user: #182030;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: ui-sans-serif, system-ui, "Segoe UI", sans-serif;
        letter-spacing: 0.01em;
      }
      .app {
        height: 100dvh;
        max-height: 100dvh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      header {
        flex-shrink: 0;
        padding: 0.85rem clamp(1rem, 3vw, 2rem);
        border-bottom: 1px solid var(--line);
      }
      .header-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
      }
      header h1 {
        margin: 0;
        font-size: clamp(0.95rem, 2.5vw, 1.05rem);
        font-weight: 500;
        letter-spacing: 0.05em;
      }
      .btn-header {
        flex-shrink: 0;
        font-size: 0.8rem;
        padding: 0.4rem 0.75rem;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        font-weight: 500;
      }
      .btn-header:hover {
        color: var(--text);
        background: rgba(255, 255, 255, 0.05);
        border-color: rgba(255, 255, 255, 0.12);
      }
      .btn-header.d-none {
        display: none !important;
      }
      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 0;
        overflow: hidden;
        width: 100%;
        max-width: 100%;
        padding: 0 clamp(0.75rem, 2.5vw, 2rem);
        padding-bottom: env(safe-area-inset-bottom, 0);
      }
      #authPanel,
      #chatPanel {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 0;
        width: 100%;
        max-width: 100%;
      }
      #chatPanel.d-none,
      #authPanel.d-none {
        display: none !important;
      }
      #authPanel {
        overflow-y: auto;
        padding-bottom: 1rem;
        -webkit-overflow-scrolling: touch;
      }
      /* Solo el historial hace scroll; el compositor queda fijo abajo */
      .chat-scroll {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        overflow-x: hidden;
        -webkit-overflow-scrolling: touch;
        padding-bottom: 0.35rem;
      }
      .chat-footer {
        flex-shrink: 0;
        padding-bottom: max(0.5rem, env(safe-area-inset-bottom, 0));
        background: linear-gradient(to top, var(--bg) 70%, transparent);
      }
      label.lbl {
        display: block;
        font-size: 0.75rem;
        color: var(--muted);
        margin-bottom: 0.4rem;
      }
      input[type="password"],
      textarea {
        width: 100%;
        padding: 0.65rem 0.75rem;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: #08090c;
        color: var(--text);
        font-size: 0.9375rem;
      }
      textarea:focus,
      input:focus {
        outline: none;
        border-color: rgba(138, 164, 199, 0.35);
      }
      button.primary {
        margin-top: 0.75rem;
        width: 100%;
        padding: 0.65rem;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: transparent;
        color: var(--text);
        font-weight: 500;
        cursor: pointer;
      }
      button.primary:hover {
        background: rgba(255, 255, 255, 0.04);
      }
      #messages {
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: clamp(0.65rem, 1.5vw, 1rem);
        background: var(--card);
        min-height: 8rem;
      }
      .bubble {
        max-width: min(92%, 52rem);
        padding: 0.5rem 0.65rem;
        border-radius: 12px;
        margin-bottom: 0.45rem;
        font-size: clamp(0.85rem, 1.6vw, 0.92rem);
        line-height: 1.5;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .bubble.user {
        margin-left: auto;
        background: var(--user);
        border: 1px solid var(--line);
      }
      .bubble.bot {
        margin-right: auto;
        background: #0e1118;
        border: 1px solid var(--line);
      }
      .bubble.bot img {
        max-width: min(100%, 48rem);
        height: auto;
        border-radius: 8px;
        display: block;
        margin-top: 0.35rem;
      }
      .bubble.bot audio {
        width: 100%;
        max-width: 32rem;
        margin-top: 0.35rem;
      }
      .bubble.bot a.file-dl {
        color: var(--accent);
        font-size: 0.85rem;
        display: inline-block;
        margin-top: 0.35rem;
      }
      .composer {
        display: flex;
        align-items: stretch;
        gap: 0;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #08090c;
        overflow: hidden;
      }
      .composer textarea {
        flex: 1;
        min-width: 0;
        border: none;
        border-radius: 0;
        min-height: 2.75rem;
        max-height: 8rem;
        resize: none;
        padding: 0.65rem 0.5rem;
      }
      .btn-icon {
        flex-shrink: 0;
        width: 2.75rem;
        border: none;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: color 0.15s, background 0.15s;
      }
      .btn-icon:hover {
        color: var(--text);
        background: rgba(255, 255, 255, 0.04);
      }
      .btn-icon.has-file {
        color: var(--accent);
      }
      .btn-live {
        flex-shrink: 0;
        width: 2.75rem;
        border: none;
        border-left: 1px solid var(--line);
        background: transparent;
        color: #6ee7b7;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: color 0.15s, background 0.15s;
      }
      .btn-live:hover {
        color: #a7f3d0;
        background: rgba(110, 231, 183, 0.08);
      }
      .btn-live.active {
        color: #f87171;
        background: rgba(248, 113, 113, 0.12);
        animation: mic-pulse 1.2s ease-in-out infinite;
      }
      .btn-live:disabled {
        opacity: 0.35;
        cursor: not-allowed;
      }
      .btn-mic {
        flex-shrink: 0;
        width: 2.75rem;
        border: none;
        border-left: 1px solid var(--line);
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: color 0.15s, background 0.15s;
      }
      .btn-mic:hover {
        color: var(--text);
        background: rgba(255, 255, 255, 0.04);
      }
      .btn-mic.recording {
        color: #f87171;
        background: rgba(248, 113, 113, 0.12);
        animation: mic-pulse 1s ease-in-out infinite;
      }
      .btn-mic:disabled {
        opacity: 0.35;
        cursor: not-allowed;
      }
      @keyframes mic-pulse {
        50% {
          opacity: 0.85;
        }
      }
      .live-call-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        margin-bottom: 0.45rem;
        padding: 0.5rem 0.65rem;
        border-radius: 10px;
        border: 1px solid rgba(110, 231, 183, 0.35);
        background: rgba(16, 185, 129, 0.08);
        font-size: 0.8rem;
      }
      .live-call-bar.d-none {
        display: none !important;
      }
      .live-call-bar button {
        flex-shrink: 0;
        padding: 0.35rem 0.65rem;
        border-radius: 8px;
        border: 1px solid rgba(248, 113, 113, 0.45);
        background: rgba(248, 113, 113, 0.12);
        color: #fecaca;
        cursor: pointer;
        font-size: 0.78rem;
        font-weight: 600;
      }
      .live-call-bar button:hover {
        background: rgba(248, 113, 113, 0.2);
      }
      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      .attach-hint {
        font-size: 0.7rem;
        color: var(--muted);
        margin: 0 0 0.35rem 0;
        padding: 0 0.15rem;
      }
      .err {
        color: #e88;
        font-size: 0.8rem;
        margin-top: 0.35rem;
      }
      .crypto-card {
        border-radius: 14px;
        padding: 0.85rem 1rem;
        margin: 0.35rem 0 0 0;
        max-width: 22rem;
        background: linear-gradient(
          135deg,
          var(--g1, #2563eb) 0%,
          var(--g2, #7c3aed) 100%
        );
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
        border: 1px solid rgba(255, 255, 255, 0.12);
      }
      .crypto-card-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
        margin-bottom: 0.35rem;
      }
      .crypto-card-name {
        font-size: 0.72rem;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.88);
      }
      .crypto-card-sym {
        font-size: 0.75rem;
        font-weight: 700;
        color: rgba(255, 255, 255, 0.95);
        background: rgba(0, 0, 0, 0.2);
        padding: 0.15rem 0.45rem;
        border-radius: 6px;
      }
      .crypto-card-price {
        font-size: 1.35rem;
        font-weight: 700;
        color: #fff;
        letter-spacing: -0.02em;
        line-height: 1.2;
      }
      .crypto-card-meta {
        margin-top: 0.45rem;
        font-size: 0.78rem;
        color: rgba(255, 255, 255, 0.82);
        line-height: 1.45;
      }
      .crypto-chip {
        display: inline-block;
        font-size: 0.72rem;
        font-weight: 600;
        padding: 0.12rem 0.4rem;
        border-radius: 999px;
        margin-top: 0.35rem;
      }
      .crypto-chip.up {
        background: rgba(16, 185, 129, 0.35);
        color: #bbf7d0;
      }
      .crypto-chip.down {
        background: rgba(248, 113, 113, 0.35);
        color: #fecaca;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header>
        <div class="header-row">
          <h1>Jarvis Bot</h1>
          <button type="button" class="btn-header d-none" id="btnLogout" title="Cerrar sesión y volver al login">
            Salir
          </button>
        </div>
      </header>

      <main>
        <div id="authPanel">
          <form id="authForm" autocomplete="off" novalidate>
            <label class="lbl" for="tok">Clave de acceso</label>
            <input
              type="password"
              id="tok"
              name="jarvis_web_key"
              placeholder="Ingresá la clave"
              autocomplete="off"
              autocorrect="off"
              autocapitalize="off"
              spellcheck="false"
              inputmode="text"
            />
            <p class="err" id="authErr"></p>
            <button type="submit" class="primary" id="btnLogin">Entrar</button>
          </form>
        </div>

        <div id="chatPanel" class="d-none">
          <div class="chat-scroll" id="chatScroll" role="log" aria-label="Mensajes">
            <div id="messages"></div>
          </div>
          <div class="chat-footer">
            <p class="attach-hint">
              Escribí y pulsá Enter para enviar. Mantené pulsado el micrófono (derecha) para un mensaje corto; el botón verde inicia una «llamada» Gemini Live hasta que colgues. Podés adjuntar imagen para editar con la IA.
            </p>
            <div id="liveCallBar" class="live-call-bar d-none" aria-hidden="true">
              <span id="liveCallStatus">Llamada Gemini Live — hablando…</span>
              <button type="button" id="btnHangup">Colgar</button>
            </div>
            <input
              type="file"
              id="fileInput"
              class="visually-hidden"
              accept="image/*,.pdf,.doc,.docx,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document"
              tabindex="-1"
            />
            <form id="chatForm" class="composer" autocomplete="off">
              <button type="button" class="btn-icon" id="btnAttach" title="Adjuntar imagen o archivo" aria-label="Adjuntar imagen o archivo">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M21.44 11.05l-9.19 9.19a4.5 4.5 0 0 1-6.36-6.36l8.49-8.49a3 3 0 0 1 4.24 4.24l-8.3 8.3a1.5 1.5 0 0 1-2.12-2.12l7.78-7.79" />
                </svg>
              </button>
              <textarea id="msgInput" rows="1" placeholder="Escribí un mensaje…"></textarea>
              <button type="button" class="btn-live" id="btnLive" title="Gemini Live: llamada hasta colgar" aria-label="Llamada Gemini Live">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z" />
                </svg>
              </button>
              <button type="button" class="btn-mic" id="btnMic" title="Mantener: mensaje de voz corto (Gemini)" aria-label="Micrófono">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z" />
                  <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
                  <line x1="12" y1="19" x2="12" y2="23" />
                  <line x1="8" y1="23" x2="16" y2="23" />
                </svg>
              </button>
            </form>
            <p class="err" id="chatErr"></p>
          </div>
        </div>
      </main>
    </div>

    <script>
      (function () {
        var LS_TOK = "jarvis_web_chat_token";
        var LS_SID = "jarvis_web_chat_session_id";
        function sid() {
          var s = localStorage.getItem(LS_SID);
          if (!s) {
            s =
              (crypto.randomUUID && crypto.randomUUID()) ||
              "s-" + String(Date.now()) + "-" + String(Math.random()).slice(2);
            localStorage.setItem(LS_SID, s);
          }
          return s;
        }

        function normalizeClientToken(s) {
          if (!s) return "";
          var t = String(s)
            .trim()
            .replace(/[\u200b\u200c\u200d\ufeff\u2060]/g, "")
            .trim();
          t = t.replace(/[０-９]/g, function (ch) {
            return String.fromCharCode(ch.charCodeAt(0) - 0xff10 + 0x30);
          });
          return t;
        }
        var authPanel = document.getElementById("authPanel");
        var chatPanel = document.getElementById("chatPanel");
        var chatScroll = document.getElementById("chatScroll");
        var authForm = document.getElementById("authForm");
        var chatForm = document.getElementById("chatForm");
        var tokEl = document.getElementById("tok");
        var btnLogin = document.getElementById("btnLogin");
        var messages = document.getElementById("messages");
        var msgInput = document.getElementById("msgInput");
        var authErr = document.getElementById("authErr");
        var chatErr = document.getElementById("chatErr");
        var fileInput = document.getElementById("fileInput");
        var btnAttach = document.getElementById("btnAttach");
        var btnLogout = document.getElementById("btnLogout");
        var btnMic = document.getElementById("btnMic");
        var btnLive = document.getElementById("btnLive");
        var liveCallBar = document.getElementById("liveCallBar");
        var btnHangup = document.getElementById("btnHangup");

        var voiceStream = null;
        var voiceRecorder = null;
        var voiceRecording = false;
        var voiceCancelStart = false;
        var liveCallMode = false;

        function setComposerBusy(on) {
          if (btnMic) btnMic.disabled = !!on;
          if (btnLive) btnLive.disabled = !!on;
        }

        function scrollChatToBottom() {
          if (chatScroll) {
            chatScroll.scrollTop = chatScroll.scrollHeight;
          }
        }

        function showChat() {
          authPanel.classList.add("d-none");
          chatPanel.classList.remove("d-none");
          if (btnLogout) btnLogout.classList.remove("d-none");
        }
        function showAuth() {
          chatPanel.classList.add("d-none");
          authPanel.classList.remove("d-none");
          if (btnLogout) btnLogout.classList.add("d-none");
        }
        function appendBubble(text, who) {
          var d = document.createElement("div");
          d.className = "bubble " + (who === "user" ? "user" : "bot");
          d.textContent = text;
          messages.appendChild(d);
          scrollChatToBottom();
        }

        var pendingAudioBubble = null;

        function appendBotParts(parts) {
          var d = document.createElement("div");
          d.className = "bubble bot";
          if (!parts || !parts.length) {
            d.textContent = "(sin respuesta)";
            messages.appendChild(d);
            scrollChatToBottom();
            return;
          }
          var textParts = [];
          var mediaParts = [];
          parts.forEach(function (p) {
            if (!p || !p.type) return;
            if (p.type === "text" || p.type === "crypto_quote") textParts.push(p);
            else mediaParts.push(p);
          });
          function appendPart(p) {
            if (p.type === "text") {
              var t = document.createElement("div");
              t.style.whiteSpace = "pre-wrap";
              t.textContent = p.text || "";
              d.appendChild(t);
            } else if (p.type === "crypto_quote") {
              var card = document.createElement("div");
              card.className = "crypto-card";
              if (p.gradient_from && p.gradient_to) {
                card.style.setProperty("--g1", p.gradient_from);
                card.style.setProperty("--g2", p.gradient_to);
              }
              var head = document.createElement("div");
              head.className = "crypto-card-head";
              var nm = document.createElement("div");
              nm.className = "crypto-card-name";
              nm.textContent = p.name || "";
              var sy = document.createElement("div");
              sy.className = "crypto-card-sym";
              sy.textContent = p.symbol || "";
              head.appendChild(nm);
              head.appendChild(sy);
              card.appendChild(head);
              var pr = document.createElement("div");
              pr.className = "crypto-card-price";
              pr.textContent = p.price_usd || "";
              card.appendChild(pr);
              if (p.has_ars && p.price_ars) {
                var ars = document.createElement("div");
                ars.className = "crypto-card-meta";
                ars.textContent = p.price_ars;
                card.appendChild(ars);
              }
              if (p.change_label) {
                var ch = document.createElement("span");
                ch.className = "crypto-chip " + (p.change_up === false ? "down" : "up");
                ch.textContent = "24h " + p.change_label;
                card.appendChild(ch);
              }
              var meta = document.createElement("div");
              meta.className = "crypto-card-meta";
              var bits = [];
              if (p.rank) bits.push("Rank CMC #" + p.rank);
              if (p.market_cap_usd) bits.push("Cap. " + p.market_cap_usd);
              meta.textContent = bits.join(" · ");
              if (bits.length) card.appendChild(meta);
              d.appendChild(card);
            } else if (p.type === "image") {
              var img = document.createElement("img");
              img.alt = p.caption || "imagen";
              img.src = "data:" + (p.mime || "image/png") + ";base64," + (p.base64 || "");
              img.loading = "lazy";
              d.appendChild(img);
              if (p.caption) {
                var c = document.createElement("div");
                c.style.fontSize = "0.8rem";
                c.style.color = "var(--muted)";
                c.style.marginTop = "0.25rem";
                c.textContent = p.caption;
                d.appendChild(c);
              }
            } else if (p.type === "audio") {
              var aud = document.createElement("audio");
              aud.controls = true;
              aud.src = "data:" + (p.mime || "audio/mpeg") + ";base64," + (p.base64 || "");
              d.appendChild(aud);
            } else if (p.type === "file") {
              var a = document.createElement("a");
              a.className = "file-dl";
              a.href = "data:" + (p.mime || "application/octet-stream") + ";base64," + (p.base64 || "");
              a.download = p.filename || "adjunto.bin";
              a.textContent = "Descargar " + (p.filename || "archivo");
              d.appendChild(a);
            }
          }
          textParts.forEach(appendPart);
          mediaParts.forEach(appendPart);
          messages.appendChild(d);
          scrollChatToBottom();
        }

        function readNdjsonChat(r) {
          return new Promise(function (resolve, reject) {
            if (!r.ok) {
              r.json()
                .then(function (j) {
                  reject({ j: j });
                })
                .catch(function () {
                  reject({});
                });
              return;
            }
            var reader = r.body.getReader();
            var dec = new TextDecoder();
            var buf = "";
            var gotFinal = false;
            function consumeLine(line) {
              line = line.trim();
              if (!line) return;
              var j;
              try {
                j = JSON.parse(line);
              } catch (e) {
                return;
              }
              if (j.partial && j.parts) {
                appendBotParts(j.parts);
                pendingAudioBubble = messages.lastElementChild;
                scrollChatToBottom();
              } else if (j.parts && j.parts.length) {
                if (pendingAudioBubble && pendingAudioBubble.parentNode) {
                  pendingAudioBubble.remove();
                  pendingAudioBubble = null;
                }
                appendBotParts(j.parts);
                gotFinal = true;
              }
            }
            function pump() {
              reader
                .read()
                .then(function (res) {
                  if (res.value && res.value.length) {
                    buf += dec.decode(res.value, { stream: !res.done });
                  }
                  if (res.done) {
                    if (buf.trim()) {
                      buf.split("\n").forEach(consumeLine);
                    }
                    if (!gotFinal) {
                      reject(new Error("stream incompleto"));
                    } else {
                      resolve({ streamed: true });
                    }
                    return;
                  }
                  var lines = buf.split("\n");
                  buf = lines.pop() || "";
                  for (var i = 0; i < lines.length; i++) {
                    consumeLine(lines[i]);
                  }
                  return pump();
                })
                .catch(reject);
            }
            pump();
          });
        }

        function syncAttachState() {
          if (!btnAttach || !fileInput) return;
          if (fileInput.files && fileInput.files[0]) {
            btnAttach.classList.add("has-file");
          } else {
            btnAttach.classList.remove("has-file");
          }
        }

        var saved = localStorage.getItem(LS_TOK);
        if (saved) {
          tokEl.value = normalizeClientToken(saved);
        }

        function httpJson(r) {
          return r.text().then(function (txt) {
            var j = {};
            try {
              j = txt ? JSON.parse(txt) : {};
            } catch (e) {}
            return { status: r.status, ok: r.ok, j: j };
          });
        }

        function verifyKeyChain(t, done) {
          var q = "/api/jarvis-web/verify?token=" + encodeURIComponent(t);
          fetch(q, { method: "GET", credentials: "same-origin" })
            .then(httpJson)
            .then(function (x) {
              if (x.status === 404) {
                return fetch("/api/jarvis-web/verify", {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ token: t }),
                  credentials: "same-origin",
                }).then(httpJson);
              }
              return x;
            })
            .then(function (x) {
              if (x.status === 404) {
                return fetch("/api/jarvis-web/chat", {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({
                    token: t,
                    message: "",
                    session_id: sid(),
                    verify_only: true,
                  }),
                  credentials: "same-origin",
                }).then(httpJson);
              }
              return x;
            })
            .then(function (x) {
              if (x.ok && x.j && x.j.ok === true) {
                done(null);
                return;
              }
              var det = x.j && x.j.detail;
              if (typeof det === "string") {
                if (det === "Not Found" || x.status === 404) {
                  done(
                    "El servidor no tiene las rutas de verificación actualizadas. Subí jarvis_web_chat.py y reiniciá el proceso."
                  );
                  return;
                }
                done(det);
                return;
              }
              done("Clave incorrecta.");
            })
            .catch(function () {
              done("Error de red o respuesta inválida.");
            });
        }

        function doLogin() {
          authErr.textContent = "";
          var t = normalizeClientToken(tokEl.value || "");
          if (!t) {
            authErr.textContent = "Ingresá la clave.";
            return;
          }
          btnLogin.disabled = true;
          verifyKeyChain(t, function (err) {
            btnLogin.disabled = false;
            if (err) {
              authErr.textContent = err;
              localStorage.removeItem(LS_TOK);
              return;
            }
            localStorage.setItem(LS_TOK, t);
            showChat();
            msgInput.focus();
          });
        }

        authForm.addEventListener("submit", function (e) {
          e.preventDefault();
          doLogin();
        });

        if (btnAttach && fileInput) {
          btnAttach.addEventListener("click", function () {
            fileInput.click();
          });
          fileInput.addEventListener("change", syncAttachState);
        }

        if (btnLogout) {
          btnLogout.addEventListener("click", function () {
            localStorage.removeItem(LS_TOK);
            messages.innerHTML = "";
            chatErr.textContent = "";
            if (fileInput) fileInput.value = "";
            syncAttachState();
            showAuth();
            if (tokEl) tokEl.focus();
          });
        }

        function fileToBase64(file, cb) {
          var r = new FileReader();
          r.onload = function () {
            var s = String(r.result || "");
            var i = s.indexOf("base64,");
            cb(i >= 0 ? s.slice(i + 7) : null);
          };
          r.onerror = function () {
            cb(null);
          };
          r.readAsDataURL(file);
        }

        function isImageFile(f) {
          return f && f.type && f.type.indexOf("image/") === 0;
        }

        function sendVoiceBlob(blob) {
          chatErr.textContent = "";
          var t = normalizeClientToken(localStorage.getItem(LS_TOK) || "");
          if (!t) {
            liveCallMode = false;
            if (liveCallBar) liveCallBar.classList.add("d-none");
            if (btnLive) btnLive.classList.remove("active");
            setComposerBusy(false);
            showAuth();
            return;
          }
          if (!blob || blob.size < 200) {
            chatErr.textContent = "Grabación demasiado corta.";
            liveCallMode = false;
            if (liveCallBar) liveCallBar.classList.add("d-none");
            if (btnLive) btnLive.classList.remove("active");
            setComposerBusy(false);
            return;
          }
          setComposerBusy(true);
          var reader = new FileReader();
          reader.onloadend = function () {
            var s = String(reader.result || "");
            var i = s.indexOf("base64,");
            var b64 = i >= 0 ? s.slice(i + 7) : null;
            if (!b64) {
              chatErr.textContent = "No se pudo leer el audio.";
              setComposerBusy(false);
              return;
            }
            appendBubble("🎤 (mensaje de voz)", "user");
            fetch("/api/jarvis-web/voice-live", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                token: t,
                session_id: sid(),
                audio_base64: b64,
                audio_mime: blob.type || "audio/webm",
              }),
              credentials: "same-origin",
            })
              .then(function (r) {
                return r.json();
              })
              .then(function (j) {
                if (!j.ok) {
                  chatErr.textContent = (j.detail && String(j.detail)) || "Error en voz Gemini";
                  if (j.detail && String(j.detail).indexOf("Token") >= 0) {
                    localStorage.removeItem(LS_TOK);
                    showAuth();
                  }
                  return;
                }
                var wrap = document.createElement("div");
                wrap.className = "bubble bot";
                var lab = document.createElement("div");
                lab.style.fontSize = "0.75rem";
                lab.style.color = "var(--muted)";
                lab.style.marginBottom = "0.35rem";
                lab.textContent = "Gemini · respuesta en voz";
                wrap.appendChild(lab);
                var aud = document.createElement("audio");
                aud.controls = true;
                aud.src = "data:" + (j.mime || "audio/mpeg") + ";base64," + (j.audio_base64 || "");
                wrap.appendChild(aud);
                messages.appendChild(wrap);
                scrollChatToBottom();
              })
              .catch(function () {
                chatErr.textContent = "Error de red al enviar voz.";
              })
              .finally(function () {
                setComposerBusy(false);
              });
          };
          reader.onerror = function () {
            chatErr.textContent = "No se pudo leer el audio.";
            setComposerBusy(false);
          };
          reader.readAsDataURL(blob);
        }

        function startVoiceCapture() {
          chatErr.textContent = "";
          voiceCancelStart = false;
          if (liveCallMode) {
            chatErr.textContent = "Colgá la llamada primero.";
            return;
          }
          var t = normalizeClientToken(localStorage.getItem(LS_TOK) || "");
          if (!t) {
            showAuth();
            return;
          }
          if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            chatErr.textContent = "Tu navegador no permite acceso al micrófono.";
            return;
          }
          if (!window.MediaRecorder) {
            chatErr.textContent = "MediaRecorder no disponible en este navegador.";
            return;
          }
          if (voiceRecording) return;
          navigator.mediaDevices
            .getUserMedia({ audio: true })
            .then(function (stream) {
              if (voiceCancelStart) {
                stream.getTracks().forEach(function (tr) {
                  tr.stop();
                });
                return;
              }
              voiceStream = stream;
              var mime = "audio/webm;codecs=opus";
              if (!MediaRecorder.isTypeSupported(mime)) mime = "audio/webm";
              if (!MediaRecorder.isTypeSupported(mime)) mime = "";
              var rec = mime
                ? new MediaRecorder(stream, { mimeType: mime })
                : new MediaRecorder(stream);
              voiceRecorder = rec;
              var chunks = [];
              rec.ondataavailable = function (e) {
                if (e.data && e.data.size) chunks.push(e.data);
              };
              rec.onstop = function () {
                var blob = new Blob(chunks, { type: rec.mimeType || "audio/webm" });
                voiceRecording = false;
                voiceRecorder = null;
                if (voiceStream) {
                  voiceStream.getTracks().forEach(function (tr) {
                    tr.stop();
                  });
                  voiceStream = null;
                }
                if (btnMic) btnMic.classList.remove("recording");
                setComposerBusy(false);
                sendVoiceBlob(blob);
              };
              rec.start();
              voiceRecording = true;
              if (btnMic) btnMic.classList.add("recording");
              setComposerBusy(true);
            })
            .catch(function (e) {
              chatErr.textContent = "Micrófono: " + (e && e.message ? e.message : "permiso denegado");
            });
        }

        function endVoiceCapture() {
          voiceCancelStart = true;
          if (!voiceRecorder || voiceRecorder.state !== "recording") return;
          try {
            voiceRecorder.stop();
          } catch (err) {}
        }

        function startLiveCallCapture() {
          chatErr.textContent = "";
          var t = normalizeClientToken(localStorage.getItem(LS_TOK) || "");
          if (!t) {
            showAuth();
            return;
          }
          if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            chatErr.textContent = "Tu navegador no permite acceso al micrófono.";
            return;
          }
          if (!window.MediaRecorder) {
            chatErr.textContent = "MediaRecorder no disponible en este navegador.";
            return;
          }
          if (voiceRecording || liveCallMode) return;
          liveCallMode = true;
          if (liveCallBar) {
            liveCallBar.classList.remove("d-none");
            liveCallBar.setAttribute("aria-hidden", "false");
          }
          if (btnLive) btnLive.classList.add("active");
          setComposerBusy(true);
          navigator.mediaDevices
            .getUserMedia({ audio: true })
            .then(function (stream) {
              voiceStream = stream;
              var mime = "audio/webm;codecs=opus";
              if (!MediaRecorder.isTypeSupported(mime)) mime = "audio/webm";
              if (!MediaRecorder.isTypeSupported(mime)) mime = "";
              var rec = mime
                ? new MediaRecorder(stream, { mimeType: mime })
                : new MediaRecorder(stream);
              voiceRecorder = rec;
              var chunks = [];
              rec.ondataavailable = function (e) {
                if (e.data && e.data.size) chunks.push(e.data);
              };
              rec.onstop = function () {
                var blob = new Blob(chunks, { type: rec.mimeType || "audio/webm" });
                voiceRecording = false;
                voiceRecorder = null;
                if (voiceStream) {
                  voiceStream.getTracks().forEach(function (tr) {
                    tr.stop();
                  });
                  voiceStream = null;
                }
                liveCallMode = false;
                if (liveCallBar) {
                  liveCallBar.classList.add("d-none");
                  liveCallBar.setAttribute("aria-hidden", "true");
                }
                if (btnLive) btnLive.classList.remove("active");
                sendVoiceBlob(blob);
              };
              rec.start();
              voiceRecording = true;
            })
            .catch(function (e) {
              liveCallMode = false;
              if (liveCallBar) liveCallBar.classList.add("d-none");
              if (btnLive) btnLive.classList.remove("active");
              setComposerBusy(false);
              chatErr.textContent = "Micrófono: " + (e && e.message ? e.message : "permiso denegado");
            });
        }

        function endLiveCallCapture() {
          if (!liveCallMode || !voiceRecorder || voiceRecorder.state !== "recording") return;
          try {
            voiceRecorder.stop();
          } catch (err) {}
        }

        if (btnMic) {
          btnMic.addEventListener("pointerdown", function (e) {
            e.preventDefault();
            voiceCancelStart = false;
            startVoiceCapture();
          });
          btnMic.addEventListener("contextmenu", function (e) {
            e.preventDefault();
          });
        }
        if (btnLive) {
          btnLive.addEventListener("click", function () {
            startLiveCallCapture();
          });
        }
        if (btnHangup) {
          btnHangup.addEventListener("click", function () {
            endLiveCallCapture();
          });
        }
        document.addEventListener("pointerup", function () {
          if (!liveCallMode) endVoiceCapture();
        });
        document.addEventListener("pointercancel", function () {
          endVoiceCapture();
        });

        function sendMsg() {
          chatErr.textContent = "";
          var t = normalizeClientToken(localStorage.getItem(LS_TOK) || "");
          if (!t) {
            showAuth();
            return;
          }
          var text = (msgInput.value || "").trim();
          var f = fileInput && fileInput.files && fileInput.files[0];

          if (!text && !f) return;

          if (f && !isImageFile(f)) {
            chatErr.textContent =
              "La edición con IA acepta solo imágenes (JPG, PNG, WebP…). PDF y Word: no soportados aún.";
            return;
          }

          var userLine = text + (f ? " [imagen adjunta]" : "");
          if (userLine.trim()) {
            appendBubble(userLine, "user");
          }
          msgInput.value = "";
          setComposerBusy(true);

          function doPost(b64, mime) {
            var payload = {
              token: t,
              message: text,
              session_id: sid(),
            };
            if (b64) {
              payload.image_base64 = b64;
              payload.image_mime = mime || "image/jpeg";
            }
            fetch("/api/jarvis-web/chat", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload),
            })
              .then(function (r) {
                var ct = (r.headers.get("content-type") || "").toLowerCase();
                if (ct.indexOf("ndjson") >= 0) {
                  return readNdjsonChat(r).then(function () {
                    return { ok: true, streamed: true };
                  });
                }
                return r.json().then(function (j) {
                  return { ok: r.ok, j: j, streamed: false };
                });
              })
              .then(function (x) {
                if (x.streamed) return;
                if (!x.ok) {
                  chatErr.textContent = (x.j && x.j.detail) || "Error";
                  if (x.j && x.j.detail && String(x.j.detail).indexOf("Token") >= 0) {
                    localStorage.removeItem(LS_TOK);
                    showAuth();
                  }
                  return;
                }
                if (x.j.parts && x.j.parts.length) {
                  appendBotParts(x.j.parts);
                } else {
                  appendBubble(x.j.reply || "", "bot");
                }
              })
              .catch(function (err) {
                pendingAudioBubble = null;
                if (err && err.j && err.j.detail) {
                  chatErr.textContent = err.j.detail;
                  if (String(err.j.detail).indexOf("Token") >= 0) {
                    localStorage.removeItem(LS_TOK);
                    showAuth();
                  }
                  return;
                }
                chatErr.textContent = "Sin respuesta del servidor.";
              })
              .finally(function () {
                setComposerBusy(false);
                if (fileInput) {
                  fileInput.value = "";
                  syncAttachState();
                }
              });
          }

          if (f) {
            fileToBase64(f, function (b64) {
              if (!b64) {
                chatErr.textContent = "No se pudo leer el archivo.";
                setComposerBusy(false);
                return;
              }
              doPost(b64, f.type || "image/jpeg");
            });
          } else {
            doPost(null, null);
          }
        }
        chatForm.addEventListener("submit", function (e) {
          e.preventDefault();
          sendMsg();
        });

        msgInput.addEventListener("keydown", function (e) {
          if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            sendMsg();
          }
        });
      })();
    </script>
  </body>
</html>
