# Nginx delante del bridge Jarvis (8766).
# Puerto 80 → proxy a FastAPI: página de bienvenido en /, webhooks, paneles admin, etc.
#
# Instalación (Ubuntu/Debian):
#   sudo cp deploy/nginx-jarvis-bridge.conf /etc/nginx/sites-available/jarvis-bridge
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo ln -sf /etc/nginx/sites-available/jarvis-bridge /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:8766;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }
}
