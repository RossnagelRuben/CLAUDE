# Ejemplo: HTTPS con Let's Encrypt (Certbot) delante del bridge (8766).
# Motivo: Google OAuth suele rechazar redirect_uri HTTP con IP pública.
#
# Requisitos: un DOMINIO con registro A → IP del VPS (no sirve solo la IP).
#
# 1) Instalá certbot y el plugin nginx (Ubuntu):
#    sudo apt install -y certbot python3-certbot-nginx
#
# 2) Copiá este archivo y reemplazá TU_DOMINIO (ej. jarvis.midominio.com):
#    sudo cp deploy/nginx-jarvis-bridge-ssl.example.conf /etc/nginx/sites-available/jarvis-bridge
#    sudo ln -sf /etc/nginx/sites-available/jarvis-bridge /etc/nginx/sites-enabled/
#    sudo nginx -t && sudo systemctl reload nginx
#
# 3) Obtené el certificado (Certbot ajusta nginx o usá certonly):
#    sudo certbot --nginx -d TU_DOMINIO
#
# 4) En Google Cloud → Credenciales OAuth → URI autorizada EXACTA:
#    https://TU_DOMINIO/admin/google/oauth/callback
#
# 5) En /root/telegram-bot/.env:
#    GOOGLE_OAUTH_REDIRECT_URI=https://TU_DOMINIO/admin/google/oauth/callback
#    JARVIS_PUBLIC_BASE_URL=https://TU_DOMINIO
#
# 6) sudo systemctl restart jarvis-whatsapp-bridge

server {
    listen 80;
    listen [::]:80;
    server_name TU_DOMINIO;
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name TU_DOMINIO;

    # Certbot rellena ssl_certificate y ssl_certificate_key al emitir el cert.
    # ssl_certificate /etc/letsencrypt/live/TU_DOMINIO/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/TU_DOMINIO/privkey.pem;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:8766;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }
}
