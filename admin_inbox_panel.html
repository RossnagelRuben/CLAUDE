<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jarvis — Bandeja WhatsApp</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        background: radial-gradient(circle at 90% 10%, #1a3d32 0%, #0b1220 50%, #070b14 100%);
      }
      .glass {
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 16px;
        backdrop-filter: blur(10px);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      }
      .thumb {
        max-height: 72px;
        max-width: 120px;
        object-fit: cover;
        border-radius: 8px;
      }
    </style>
  </head>
  <body class="text-light">
    <div class="container py-4" style="max-width: 1100px">
      <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3">
        <div>
          <div class="fw-semibold fs-5">Bandeja Jarvis (WhatsApp)</div>
          <div class="text-secondary small">
            Notas en <span class="mono">notes/</span> · Medios en <span class="mono">wa_inbox/media/</span>
          </div>
        </div>
        <div class="text-secondary small mono">/admin/inbox</div>
      </div>

      <div class="glass p-3 mb-3">
        <label class="form-label text-secondary small" for="tok">Token admin (mismo que <span class="mono">ADMIN_PANEL_TOKEN</span> / Bearer del panel WhatsApp)</label>
        <div class="input-group input-group-sm">
          <input type="password" id="tok" class="form-control mono" autocomplete="off" placeholder="Pegá el token y guardá en este navegador" />
          <button class="btn btn-primary" type="button" id="btnSaveTok">Guardar</button>
          <button class="btn btn-outline-light" type="button" id="btnLoad">Actualizar lista</button>
        </div>
        <div id="err" class="text-warning small mt-2 d-none"></div>
      </div>

      <div class="glass p-3 mb-3">
        <div class="d-flex flex-wrap align-items-center gap-2 mb-2">
          <button class="btn btn-sm btn-outline-danger" type="button" id="btnDel" disabled>Eliminar seleccionados</button>
          <span class="text-secondary small" id="selCount"></span>
        </div>
        <div class="table-responsive">
          <table class="table table-dark table-hover table-sm align-middle mb-0">
            <thead>
              <tr>
                <th style="width: 36px"><input type="checkbox" id="chkAll" title="Seleccionar todos" /></th>
                <th>Tipo</th>
                <th>Archivo</th>
                <th>Tamaño</th>
                <th>Fecha</th>
                <th>Vista</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <p class="text-secondary small mt-2 mb-0" id="emptyHint"></p>
      </div>
    </div>

    <div class="modal fade" id="editModal" tabindex="-1">
      <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content bg-dark text-light border-secondary">
          <div class="modal-header border-secondary">
            <h5 class="modal-title">Editar nota</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <p class="small text-secondary mono" id="editRel"></p>
            <textarea id="editBody" class="form-control mono" rows="14"></textarea>
          </div>
          <div class="modal-footer border-secondary">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
            <button type="button" class="btn btn-primary" id="btnSaveNote">Guardar cambios</button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      const LS = "jarvis_admin_inbox_token";
      const tokEl = document.getElementById("tok");
      const errEl = document.getElementById("err");
      const rowsEl = document.getElementById("rows");
      const btnDel = document.getElementById("btnDel");
      const chkAll = document.getElementById("chkAll");
      const selCount = document.getElementById("selCount");
      const emptyHint = document.getElementById("emptyHint");
      let items = [];
      let editingRel = "";

      function token() {
        return (tokEl.value || localStorage.getItem(LS) || "").trim();
      }

      function authHeaders() {
        const t = token();
        return t ? { Authorization: "Bearer " + t, Accept: "application/json" } : { Accept: "application/json" };
      }

      function showErr(msg) {
        if (!msg) {
          errEl.classList.add("d-none");
          errEl.textContent = "";
          return;
        }
        errEl.textContent = msg;
        errEl.classList.remove("d-none");
      }

      function rawUrl(rel) {
        const t = encodeURIComponent(token());
        const r = encodeURIComponent(rel);
        return `/admin/inbox/api/raw?rel=${r}&token=${t}`;
      }

      function fmtSize(n) {
        if (n < 1024) return n + " B";
        if (n < 1024 * 1024) return (n / 1024).toFixed(1) + " KB";
        return (n / (1024 * 1024)).toFixed(1) + " MB";
      }

      function updateSel() {
        const n = rowsEl.querySelectorAll("input.row-chk:checked").length;
        btnDel.disabled = n === 0;
        selCount.textContent = n ? n + " seleccionados" : "";
      }

      function render() {
        rowsEl.innerHTML = "";
        if (!items.length) {
          emptyHint.textContent = token()
            ? "No hay archivos. Enviá fotos, audios o documentos por WhatsApp (o guardá notas con el bot)."
            : "Ingresá el token y pulsá Actualizar lista.";
          chkAll.checked = false;
          updateSel();
          return;
        }
        emptyHint.textContent = "";
        for (const it of items) {
          const tr = document.createElement("tr");
          const kind = it.kind || "";
          let preview = "—";
          if (kind === "image") {
            preview = `<img class="thumb" alt="" src="${rawUrl(it.rel)}" loading="lazy" />`;
          } else if (kind === "video") {
            preview = `<video class="thumb" controls preload="metadata" src="${rawUrl(it.rel)}"></video>`;
          } else if (kind === "audio") {
            preview = `<audio controls preload="none" src="${rawUrl(it.rel)}" style="max-width:220px;height:32px"></audio>`;
          } else if (kind === "document") {
            preview = `<a class="link-info small" href="${rawUrl(it.rel)}" target="_blank" rel="noopener">Abrir</a>`;
          } else if (kind === "note") {
            preview = `<span class="text-secondary small">texto</span>`;
          }
          const editBtn =
            kind === "note"
              ? `<button type="button" class="btn btn-sm btn-outline-warning btn-edit" data-rel="${it.rel.replace(/"/g, "&quot;")}">Editar</button>`
              : "—";
          tr.innerHTML = `
            <td><input type="checkbox" class="row-chk form-check-input" data-rel="${it.rel.replace(/"/g, "&quot;")}" /></td>
            <td class="small text-capitalize">${kind}</td>
            <td class="mono small">${it.name}</td>
            <td class="small">${fmtSize(it.size || 0)}</td>
            <td class="small text-secondary">${it.mtime_iso || ""}</td>
            <td>${preview}</td>
            <td>${editBtn}</td>`;
          rowsEl.appendChild(tr);
        }
        rowsEl.querySelectorAll(".row-chk").forEach((c) => c.addEventListener("change", updateSel));
        rowsEl.querySelectorAll(".btn-edit").forEach((b) =>
          b.addEventListener("click", () => openEdit(b.getAttribute("data-rel")))
        );
        chkAll.checked = false;
        updateSel();
      }

      async function loadItems() {
        showErr("");
        const t = token();
        if (!t) {
          showErr("Falta el token.");
          items = [];
          render();
          return;
        }
        const res = await fetch("/admin/inbox/api/items", { headers: authHeaders() });
        if (!res.ok) {
          showErr("No autorizado o error " + res.status + ". Revisá ADMIN_PANEL_TOKEN.");
          items = [];
          render();
          return;
        }
        const data = await res.json();
        items = data.items || [];
        render();
      }

      async function openEdit(rel) {
        editingRel = rel;
        document.getElementById("editRel").textContent = rel;
        document.getElementById("editBody").value = "Cargando…";
        const modal = new bootstrap.Modal(document.getElementById("editModal"));
        modal.show();
        const res = await fetch(rawUrl(rel), { headers: { Authorization: "Bearer " + token() } });
        const txt = await res.text();
        document.getElementById("editBody").value = res.ok ? txt : "Error al leer el archivo";
      }

      document.getElementById("btnSaveNote").addEventListener("click", async () => {
        const body = document.getElementById("editBody").value;
        const res = await fetch("/admin/inbox/api/note", {
          method: "PUT",
          headers: { ...authHeaders(), "Content-Type": "application/json" },
          body: JSON.stringify({ rel: editingRel, content: body }),
        });
        if (!res.ok) {
          alert("No se pudo guardar (" + res.status + ")");
          return;
        }
        bootstrap.Modal.getInstance(document.getElementById("editModal")).hide();
        await loadItems();
      });

      document.getElementById("btnDel").addEventListener("click", async () => {
        const rels = [...rowsEl.querySelectorAll("input.row-chk:checked")].map((c) => c.getAttribute("data-rel"));
        if (!rels.length) return;
        if (!confirm("¿Eliminar " + rels.length + " archivo(s) del servidor?")) return;
        const res = await fetch("/admin/inbox/api/delete", {
          method: "POST",
          headers: { ...authHeaders(), "Content-Type": "application/json" },
          body: JSON.stringify({ rels }),
        });
        if (!res.ok) {
          alert("Error al borrar (" + res.status + ")");
          return;
        }
        await loadItems();
      });

      chkAll.addEventListener("change", () => {
        rowsEl.querySelectorAll(".row-chk").forEach((c) => {
          c.checked = chkAll.checked;
        });
        updateSel();
      });

      document.getElementById("btnSaveTok").addEventListener("click", () => {
        localStorage.setItem(LS, tokEl.value.trim());
        showErr("");
        loadItems();
      });

      document.getElementById("btnLoad").addEventListener("click", loadItems);

      tokEl.value = localStorage.getItem(LS) || "";
      loadItems();
    </script>
  </body>
</html>
