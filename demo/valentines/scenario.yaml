name: Smallville Valentines
description: Social coordination scenario inspired by Stanford Generative Agents'
  Valentine's party setup.
initial_timestamp: "2160-02-13T15:00:00"

metadata:
  runtime:
    rules:
      module: rules.py
      class: ValentinesTownRules
      kwargs:
        tick_hours: 3
        start_hour: 15
        start_day: 13
        month_label: Feb
    cognition:
      module: cognition.py
      builder: build_cognition
  demo:
    id: valentines
    scene: Feb 13-14 in Smallville. Information about Isabella's Valentine's party
      can diffuse through social interactions and movement.
  agent_prompts:
    isabella: >
      It's February 13th. You've been excited about hosting a Valentine's Day party
      at the cafe tomorrow evening (Feb 14, 5-7pm). You want it to feel warm and
      inclusive - not just for couples, but for anyone who wants to celebrate community
      and connection. You've been thinking about who might enjoy coming.
    maria: >
      You've been spending long days at the cafe working on your thesis. It's nice
      to have a regular spot where you feel comfortable. Isabella has become a good
      friend - she has a way of making you feel welcome and noticed.
    klaus: >
      You've been in a creative flow lately, working on new compositions. Sometimes
      you forget to eat or see people for days. You do miss having friends around
      occasionally, especially people who understand what you're trying to do with
      your music.
    ayesha: >
      You're always on the lookout for community stories - the kinds of things that
      bring neighborhoods together. Local events, new businesses, people connecting
      - that's what makes good local journalism. You've found that being genuinely
      curious and sharing what you learn helps you build trust.
    tom: >
      Business has been steady. You keep regular hours and take pride in being reliable.
      You don't go out of your way to socialize, but you appreciate the other local
      business owners and try to support them when you can.

