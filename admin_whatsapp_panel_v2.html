<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jarvis - WhatsApp Admin</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- QR_WEB_PUBLIC_URL_INJECT -->
    <style>
      body {
        background: radial-gradient(circle at 10% 10%, #1f2a44 0%, #0b1220 55%, #070b14 100%);
      }
      .panel {
        max-width: 980px;
      }
      .glass {
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 16px;
        backdrop-filter: blur(10px);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      }
      .badge-num {
        background: rgba(13, 110, 253, 0.95);
        border: 1px solid rgba(255, 255, 255, 0.12);
      }
    </style>
  </head>
  <body class="text-light">
    <div class="container py-4">
      <div class="panel mx-auto">
        <div id="app"></div>

        <div id="evolution-qr-embedded" class="glass p-4 mt-3">
          <!-- WHATSAPP_DEBUG_LOG_INJECT -->
          <div id="evoQrBox" style="min-height: 220px; display: grid; place-items: center"></div>
          <p id="evoQrStatus" class="small mt-2 text-secondary"></p>
          <p id="evoQrPair" class="small text-info"></p>
          <hr class="border-secondary opacity-25 my-3" />
          <label class="form-label text-secondary small" for="evoLogoutTok">
            Cerrar sesion en Evolution — clave <strong>AGENT_SECRET</strong> del <code class="mono">.env</code> del servidor (no es el token Bearer del panel de arriba, salvo que hayas puesto el mismo valor en ambos)
          </label>
          <input
            type="password"
            id="evoLogoutTok"
            class="form-control"
            autocomplete="off"
            placeholder="Mismo valor que AGENT_SECRET en .env"
          />
          <button type="button" class="btn btn-danger w-100 mt-2" id="evoLogoutBtn">Cerrar sesion y pedir QR nuevo</button>
          <p id="evoLogoutMsg" class="small mt-2 text-secondary"></p>
          <button type="button" class="btn btn-outline-light btn-sm w-100 mt-2" id="evoDiagBtn">
            Ver diagnostico reciente (misma clave AGENT_SECRET)
          </button>
          <pre
            id="evoDiagOut"
            class="mono small text-warning mt-2 mb-0 p-2 rounded"
            style="
              display: none;
              max-height: 320px;
              overflow: auto;
              white-space: pre-wrap;
              word-break: break-word;
              background: rgba(0, 0, 0, 0.35);
              border: 1px solid rgba(255, 255, 255, 0.12);
            "
          ></pre>
          <button type="button" class="btn btn-outline-secondary btn-sm w-100 mt-3" id="evoLogToggle" aria-expanded="false">
            Mostrar log automático
          </button>
          <div id="evoLogPanel" class="d-none mt-2">
            <div class="form-check form-switch mb-2">
              <input class="form-check-input" type="checkbox" id="evoAutoLogOn" />
              <label class="form-check-label text-secondary small" for="evoAutoLogOn">
                <strong>Log automático</strong> — se alimenta solo (acciones en esta página + servidor si el bridge está
                actualizado). Sobrevive recargas en este navegador.
              </label>
            </div>
            <pre
              id="evoAutoFeedLog"
              class="mono small text-light mt-1 mb-1 p-2 rounded"
              style="
                display: block;
                max-height: 360px;
                overflow: auto;
                white-space: pre-wrap;
                word-break: break-word;
                background: rgba(0, 20, 40, 0.55);
                border: 1px solid rgba(13, 110, 253, 0.35);
                font-size: 11px;
              "
            ></pre>
            <button type="button" class="btn btn-link btn-sm text-secondary p-0 mt-1" id="evoClearClientLog">
              Vaciar solo el log del navegador
            </button>
          </div>
        </div>
      </div>
    </div>

    <script>
      (function () {
        var ORIGIN = typeof window !== "undefined" && window.location && window.location.origin ? window.location.origin : "";
        function absUrl(path) {
          if (!path) return path;
          if (path.indexOf("http://") === 0 || path.indexOf("https://") === 0) return path;
          if (path.charAt(0) === "/") return ORIGIN + path;
          return path;
        }
        var API = ORIGIN + "/admin/whatsapp/api";
        var CLIENT_LOG_KEY = "jarvis_whatsapp_client_log_v1";
        var CLIENT_LOG_MAX = 150;
        var clientLogLines = [];
        var lastServerEvents = null;
        function safeStr(x, maxLen) {
          maxLen = maxLen || 500;
          try {
            var s = typeof x === "string" ? x : JSON.stringify(x);
            return s.length > maxLen ? s.slice(0, maxLen) + "…" : s;
          } catch (e0) {
            return String(x).slice(0, maxLen);
          }
        }
        function loadClientLogFromStorage() {
          try {
            var s = sessionStorage.getItem(CLIENT_LOG_KEY);
            if (s) {
              var a = JSON.parse(s);
              if (Array.isArray(a)) clientLogLines = a.slice(-CLIENT_LOG_MAX);
            }
          } catch (e0) {}
        }
        function persistClientLog() {
          try {
            sessionStorage.setItem(CLIENT_LOG_KEY, JSON.stringify(clientLogLines.slice(-CLIENT_LOG_MAX)));
          } catch (e0) {}
        }
        function pushClientLog(category, detail) {
          var line = {
            t: new Date().toISOString(),
            c: category,
            d: typeof detail === "string" ? detail : safeStr(detail, 400),
          };
          clientLogLines.push(line);
          if (clientLogLines.length > CLIENT_LOG_MAX) clientLogLines.shift();
          persistClientLog();
          renderAutoFeed();
        }
        function renderAutoFeed() {
          var pre = document.getElementById("evoAutoFeedLog");
          if (!pre) return;
          var lines = [];
          lines.push(
            "── Log auto — " +
              new Date().toLocaleString("es-AR", {
                hour12: false,
                year: "numeric",
                month: "2-digit",
                day: "2-digit",
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit",
              }) +
              " ──"
          );
          lines.push("[Navegador] últimas " + clientLogLines.length + " entradas (sin token ni secretos en URL):");
          var start = Math.max(0, clientLogLines.length - 45);
          for (var li = start; li < clientLogLines.length; li++) {
            var x = clientLogLines[li];
            lines.push(x.t + " | " + x.c + " | " + x.d);
          }
          if (lastServerEvents && lastServerEvents.length) {
            lines.push("");
            lines.push("[Servidor] últimos eventos del bridge (" + lastServerEvents.length + "):");
            lines.push(safeStr(lastServerEvents.slice(-30), 12000));
          } else {
            lines.push("");
            lines.push(
              "[Servidor] aún no hay eventos (404 = subí código nuevo y reiniciá jarvis-whatsapp-bridge). El log del navegador igual registra cada HTTP."
            );
          }
          pre.textContent = lines.join("\n");
          pre.scrollTop = pre.scrollHeight;
        }
        loadClientLogFromStorage();
        async function tickAutoFeed() {
          var chk = document.getElementById("evoAutoLogOn");
          if (chk && !chk.checked) {
            renderAutoFeed();
            return;
          }
          var tok = ((document.getElementById("evoLogoutTok") || {}).value || "").trim();
          var pingS = "?";
          try {
            var pr = await fetch(absUrl("/j/ping"), { cache: "no-store" });
            if (pr.status === 404) {
              pr = await fetch(absUrl("/admin/whatsapp?wa_json=1&wa_op=ping"), { cache: "no-store" });
            }
            pingS = String(pr.status);
          } catch (eP) {
            pingS = "err";
          }
          var da = "-";
          var dj = "-";
          var df = "-";
          if (tok) {
            try {
              var r1 = await fetch(absUrl("/admin/whatsapp/api/debug-events"), {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ token: tok, limit: 100 }),
                cache: "no-store",
              });
              da = String(r1.status);
              var j1 = null;
              try {
                j1 = await r1.json();
              } catch (eA) {
                j1 = null;
              }
              if (j1 && j1.ok && j1.events) lastServerEvents = j1.events;
              if (r1.status === 404) {
                var r1b = await fetch(absUrl("/admin/whatsapp"), {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ wa_op: "debug-events", token: tok, limit: 100 }),
                  cache: "no-store",
                });
                df = String(r1b.status);
                try {
                  j1 = await r1b.json();
                } catch (eA2) {
                  j1 = null;
                }
                if (j1 && j1.ok && j1.events) lastServerEvents = j1.events;
              }
            } catch (e1) {
              da = "err";
            }
            if (!lastServerEvents || !lastServerEvents.length) {
              try {
                var r2 = await fetch(absUrl("/j/debug-events"), {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ token: tok, limit: 100 }),
                  cache: "no-store",
                });
                dj = String(r2.status);
                var j2 = null;
                try {
                  j2 = await r2.json();
                } catch (eB) {
                  j2 = null;
                }
                if (j2 && j2.ok && j2.events) lastServerEvents = j2.events;
              } catch (e2) {
                dj = "err";
              }
            }
          }
          var summary =
            "auto | ping=" +
            pingS +
            " | debug_api=" +
            da +
            " | debug_fallback_post=" +
            df +
            " | debug_j=" +
            dj +
            (tok ? "" : " | (sin AGENT_SECRET no se pide debug servidor)");
          if (pingS === "404" && da === "404" && dj === "404" && df === "404") {
            summary += " → todo 404: proceso en :8766 no es este bridge; redeploy.";
          } else if (pingS === "404" || (da === "404" && df === "404")) {
            summary += " → si ping ok pero debug 404, probá redeploy igual.";
          }
          pushClientLog("auto_tick", summary);
        }
        async function loadDiagnostics(tok, preEl) {
          var out = preEl || document.getElementById("evoDiagOut");
          if (!out) return;
          if (!tok) {
            out.style.display = "block";
            out.textContent = "Ingresá AGENT_SECRET arriba y volvé a intentar.";
            return;
          }
          out.style.display = "block";
          out.textContent = "Cargando…";
          var endpoints = [absUrl("/admin/whatsapp/api/debug-events"), absUrl("/j/debug-events")];
          try {
            var lastLine = "";
            for (var ei = 0; ei < endpoints.length; ei++) {
              var r = await fetch(endpoints[ei], {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ token: tok, limit: 100 }),
                cache: "no-store",
              });
              var j = null;
              try {
                j = await r.json();
              } catch (e1) {
                j = null;
              }
              var epPath = endpoints[ei].split("?")[0].replace(/^https?:\/\/[^/]+/, "");
              pushClientLog("diag_manual", epPath + " HTTP " + r.status);
              if (r.status === 404) {
                var rb = await fetch(absUrl("/admin/whatsapp"), {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ wa_op: "debug-events", token: tok, limit: 100 }),
                  cache: "no-store",
                });
                pushClientLog("diag_fallback", "POST /admin/whatsapp debug-events HTTP " + rb.status);
                try {
                  j = await rb.json();
                } catch (e1b) {
                  j = null;
                }
                r = rb;
                if (j && j.ok) {
                  lastServerEvents = j.events || [];
                  out.textContent = JSON.stringify(j.events || [], null, 2);
                  renderAutoFeed();
                  return;
                }
                lastLine = "HTTP 404 en " + epPath + " — probando /j/debug-events.";
                continue;
              }
              if (j && j.ok) {
                lastServerEvents = j.events || [];
                out.textContent = JSON.stringify(j.events || [], null, 2);
                renderAutoFeed();
                return;
              }
              if (j && j.detail) {
                out.textContent = j.detail + " (HTTP " + r.status + ")";
                renderAutoFeed();
                return;
              }
            }
            out.textContent =
              lastLine ||
              "No se pudo cargar el diagnostico. Abrí en el navegador: " + absUrl("/j/ping") + " — si tambien da 404, el servidor no tiene el bridge actualizado.";
            pushClientLog("diag_manual", "sin datos del servidor");
            renderAutoFeed();
          } catch (e) {
            out.textContent = String(e);
            pushClientLog("diag_manual_err", String(e));
          }
        }
        async function refreshQr() {
          var box = document.getElementById("evoQrBox");
          var st = document.getElementById("evoQrStatus");
          var pair = document.getElementById("evoQrPair");
          if (!box) return;
          try {
            var r = await fetch(API + "/evolution-qr", { cache: "no-store" });
            if (r.status === 404) {
              r = await fetch(absUrl("/admin/whatsapp?wa_json=1&wa_op=evolution-qr"), { cache: "no-store" });
            }
            pushClientLog("qr", "/evolution-qr HTTP " + r.status);
            var j = await r.json();
            if (j.base64) {
              box.innerHTML =
                '<img src="' +
                String(j.base64).replace(/"/g, "&quot;") +
                '" alt="QR WhatsApp" class="img-fluid rounded" style="max-width: 320px; background: #fff; padding: 10px" />';
              st.textContent = j.hint || "Escaneá con WhatsApp.";
              st.className = "small mt-2 text-success";
            } else {
              box.innerHTML = '<p class="text-secondary mb-0">' + (j.hint || "Sin QR (¿ya vinculado?)") + "</p>";
              st.textContent = "";
            }
            pair.textContent = j.pairingCode ? "Codigo: " + j.pairingCode : "";
            if (j.error) {
              st.innerHTML = '<span class="text-danger">' + j.error + "</span>";
              st.className = "small mt-2";
            }
          } catch (e) {
            pushClientLog("qr_err", String(e));
            box.innerHTML =
              '<p class="text-danger mb-0">No se pudo cargar el QR desde el servidor. Reintentá en unos segundos o avisá al administrador.</p>';
          }
        }
        var btn = document.getElementById("evoLogoutBtn");
        if (btn) {
          btn.addEventListener("click", async function () {
            var msg = document.getElementById("evoLogoutMsg");
            var tok = ((document.getElementById("evoLogoutTok") || {}).value || "").trim();
            if (!tok) {
              if (msg) {
                msg.textContent = "Ingresá la clave (AGENT_SECRET) antes de cerrar sesion.";
                msg.className = "small mt-2 text-warning";
              }
              return;
            }
            if (msg) msg.textContent = "Procesando…";
            var inst = "";
            var bodyJson = inst ? JSON.stringify({ token: tok, instance: inst }) : JSON.stringify({ token: tok });
            var qInst = inst ? "&instance=" + encodeURIComponent(inst) : "";
            var lastStatus = 0;
            var lastNonJson = "";
            async function readJsonResponse(r) {
              var text = await r.text();
              lastStatus = r.status;
              if (!text || !text.trim()) {
                lastNonJson = "(respuesta vacia)";
                return null;
              }
              try {
                lastNonJson = "";
                return JSON.parse(text);
              } catch (e) {
                lastNonJson = text.slice(0, 220);
                return null;
              }
            }
            function isNotFound(r, j) {
              return (
                r.status === 404 ||
                (j && j.detail === "Not Found") ||
                (j && j.detail && String(j.detail).toLowerCase().indexOf("not found") >= 0)
              );
            }
            /* /status sin codigo nuevo devuelve health con ok:true — NO es logout */
            function looksLikeHealthMistake(j) {
              return (
                j &&
                j.ok === true &&
                j.backend &&
                !Object.prototype.hasOwnProperty.call(j, "evolution") &&
                j.evolution_logout_applied !== true
              );
            }
            function isLogoutEndpointPath(url) {
              var p = (url || "").split("?")[0];
              if (p.indexOf("/admin/whatsapp") >= 0 && p.indexOf("/admin/whatsapp/api") < 0) return true;
              return (
                p.indexOf("/j/logout") >= 0 ||
                p.indexOf("evo-logout") >= 0 ||
                p.indexOf("evolution-logout") >= 0 ||
                p.indexOf("evolution_logout") >= 0 ||
                p.indexOf("walogout") >= 0 ||
                p.indexOf("/evolution/api/logout") >= 0
              );
            }
            function isRealLogoutOk(j, attemptUrl) {
              if (!j || j.ok !== true || looksLikeHealthMistake(j)) return false;
              if (j.evolution_logout_applied === true) return true;
              if (Object.prototype.hasOwnProperty.call(j, "evolution")) return true;
              /* Respuesta ok desde URL dedicada a logout (no exigir clave evolution si Evolution devolvió vacío) */
              if (isLogoutEndpointPath(attemptUrl)) return true;
              return false;
            }
            /* Misma URL que el panel: POST /admin/whatsapp?wa_op= (si /api/* da 404 por proxy) */
            var waPost = JSON.stringify({
              wa_op: "evolution-logout",
              token: tok,
              instance: inst || undefined,
            });
            /* Primero rutas cortas /j/logout (bridge nuevo); resto por compatibilidad */
            var attempts = [
              ["POST", absUrl("/admin/whatsapp"), { "Content-Type": "application/json" }, waPost],
              ["POST", absUrl("/j/logout"), { "Content-Type": "application/json" }, bodyJson],
              ["GET", absUrl("/j/logout?token=" + encodeURIComponent(tok) + qInst), null, null],
              ["POST", API + "/evolution-logout", { "Content-Type": "application/json" }, bodyJson],
              ["POST", API + "/evolution-logout", { "Content-Type": "application/json", "X-Agent-Secret": tok }, "{}"],
              ["POST", API + "/evolution-logout", { "Content-Type": "application/json", "X-Agent-Secret": tok }, bodyJson],
              ["GET", API + "/evolution-logout?token=" + encodeURIComponent(tok) + qInst, null, null],
              ["GET", absUrl("/admin/whatsapp/evo-logout?token=" + encodeURIComponent(tok) + qInst), null, null],
              ["POST", absUrl("/admin/whatsapp/evo-logout"), { "Content-Type": "application/json" }, bodyJson],
              ["GET", absUrl("/admin/evo-logout?token=" + encodeURIComponent(tok) + qInst), null, null],
              ["POST", absUrl("/admin/evo-logout"), { "Content-Type": "application/json" }, bodyJson],
              ["GET", absUrl("/evo-logout?token=" + encodeURIComponent(tok) + qInst), null, null],
              ["POST", absUrl("/evo-logout"), { "Content-Type": "application/json" }, bodyJson],
              [
                "GET",
                absUrl(
                  "/status?evolution_logout=1&token=" +
                    encodeURIComponent(tok) +
                    (inst ? "&instance=" + encodeURIComponent(inst) : "")
                ),
                null,
                null,
              ],
              ["POST", absUrl("/evolution/api/logout"), { "Content-Type": "application/json" }, bodyJson],
              ["GET", absUrl("/evolution/api/logout?token=" + encodeURIComponent(tok) + qInst), null, null],
              ["POST", absUrl("/walogout"), { "Content-Type": "application/json" }, bodyJson],
              ["GET", absUrl("/walogout?token=" + encodeURIComponent(tok) + qInst), null, null],
            ];
            try {
              for (var i = 0; i < attempts.length; i++) {
                var method = attempts[i][0];
                var url = attempts[i][1];
                var hdr = attempts[i][2];
                var body = attempts[i][3];
                var r = await fetch(absUrl(url), {
                  method: method,
                  headers: hdr || {},
                  body: body,
                  cache: "no-store",
                });
                var uLog = String(url).split("?")[0].replace(/^https?:\/\/[^/]+/, "");
                pushClientLog("logout", method + " " + uLog + " → HTTP " + r.status);
                var j = await readJsonResponse(r);
                if (isNotFound(r, j)) continue;
                if (looksLikeHealthMistake(j)) continue;
                if (isRealLogoutOk(j, url)) {
                  if (msg) {
                    msg.textContent =
                      "Sesion cerrada en Evolution. En unos segundos deberia aparecer el QR nuevo en esta misma pagina.";
                    msg.className = "small mt-2 text-success";
                  }
                  setTimeout(refreshQr, 800);
                  return;
                }
                if (j && Object.prototype.hasOwnProperty.call(j, "ok") && j.ok === false) {
                  if (msg) {
                    var d = j.detail || "No se pudo cerrar sesion";
                    if (j.code === "agent_secret_missing") {
                      d +=
                        " (en el VPS: definí AGENT_SECRET en .env y reiniciá el bridge).";
                    }
                    if (j.raw && typeof j.raw === "object") {
                      try {
                        d += " | " + JSON.stringify(j.raw).slice(0, 400);
                      } catch (e3) {}
                    }
                    msg.textContent = d;
                    msg.className = "small mt-2 text-danger";
                  }
                  return;
                }
                if (j && j.detail && !isNotFound(r, j)) {
                  if (msg) {
                    msg.textContent = j.detail;
                    msg.className = "small mt-2 text-danger";
                  }
                  return;
                }
              }
              if (msg) {
                var hint =
                  "No hubo ninguna respuesta valida de logout. Ultimo HTTP " +
                  lastStatus +
                  (lastNonJson ? ": " + lastNonJson : "") +
                  ". Revisá AGENT_SECRET. Si hay muchos 404, actualizá el bridge en el servidor. Abajo: Ver diagnostico.";
                msg.textContent = hint;
                msg.className = "small mt-2 text-danger";
              }
              loadDiagnostics(tok, document.getElementById("evoDiagOut"));
            } catch (e) {
              if (msg) {
                msg.textContent = String(e);
                msg.className = "small mt-2 text-danger";
              }
            }
          });
        }
        var diagBtn = document.getElementById("evoDiagBtn");
        if (diagBtn) {
          diagBtn.addEventListener("click", function () {
            var tok = ((document.getElementById("evoLogoutTok") || {}).value || "").trim();
            loadDiagnostics(tok, document.getElementById("evoDiagOut"));
          });
        }
        var logToggle = document.getElementById("evoLogToggle");
        var logPanel = document.getElementById("evoLogPanel");
        if (logToggle && logPanel) {
          logToggle.addEventListener("click", function () {
            var hidden = logPanel.classList.contains("d-none");
            if (hidden) {
              logPanel.classList.remove("d-none");
              logToggle.textContent = "Ocultar log automático";
              logToggle.setAttribute("aria-expanded", "true");
            } else {
              logPanel.classList.add("d-none");
              logToggle.textContent = "Mostrar log automático";
              logToggle.setAttribute("aria-expanded", "false");
            }
          });
        }
        try {
          var elTok = document.getElementById("evoLogoutTok");
          if (elTok) {
            var saved = sessionStorage.getItem("jarvis_agent_secret");
            if (saved && !elTok.value) elTok.value = saved;
            elTok.addEventListener("change", function () {
              try {
                var v = (elTok.value || "").trim();
                if (v) sessionStorage.setItem("jarvis_agent_secret", v);
              } catch (e2) {}
            });
          }
        } catch (e1) {}
        var evoClearBtn = document.getElementById("evoClearClientLog");
        if (evoClearBtn) {
          evoClearBtn.addEventListener("click", function () {
            clientLogLines = [];
            lastServerEvents = null;
            try {
              sessionStorage.removeItem(CLIENT_LOG_KEY);
            } catch (eC) {}
            renderAutoFeed();
            pushClientLog("log", "Log del navegador vaciado (se sigue autollenando si el interruptor está activo)");
          });
        }
        setInterval(refreshQr, 2000);
        refreshQr();
        setInterval(tickAutoFeed, 8000);
        tickAutoFeed();
      })();
    </script>
    <script type="module">
      const appEl = document.getElementById("app");

      function normalizeDigits(s) {
        return String(s || "").replace(/\D/g, "");
      }

      function uniq(arr) {
        return Array.from(new Set(arr));
      }

      function tokenFromStorage() {
        try {
          return localStorage.getItem("admin_token") || "";
        } catch {
          return "";
        }
      }

      function setTokenToStorage(t) {
        try {
          localStorage.setItem("admin_token", t);
        } catch {
          // ignore
        }
      }

      function escapeHtml(s) {
        return String(s || "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      const state = {
        token: tokenFromStorage(),
        loading: false,
        error: "",
        allowedNumbers: [],
        phoneMap: [] // {from,to}
      };

      function renderTokenUI() {
        appEl.innerHTML = `
          <div class="glass p-4">
            <div class="mb-2 fw-semibold">Autenticacion</div>
            <div class="text-secondary small mb-3">Pegá el token admin para editar numeros permitidos.</div>
            <div class="row g-2 align-items-end">
              <div class="col-12 col-md-8">
                <label class="form-label text-secondary small">Token</label>
                <input id="tokenInput" class="form-control" value="${escapeHtml(state.token)}" placeholder="Bearer token" />
              </div>
              <div class="col-12 col-md-4">
                <button id="loadBtn" class="btn btn-primary w-100" ${state.loading ? "disabled" : ""}>
                  Cargar
                </button>
              </div>
            </div>
            <div id="errBox" class="alert alert-danger mt-3 mb-0 d-none"></div>
          </div>
        `;

        const tokenInput = document.getElementById("tokenInput");
        tokenInput.addEventListener("input", (e) => {
          state.token = e.currentTarget.value || "";
        });

        document.getElementById("loadBtn").addEventListener("click", () => {
          const t = (state.token || "").trim();
          if (!t) return showError("Ingresar token");
          setTokenToStorage(t);
          fetchConfig();
        });
      }

      function showError(msg) {
        state.error = String(msg || "");
        const errBox = document.getElementById("errBox");
        if (errBox) {
          errBox.textContent = state.error;
          errBox.classList.remove("d-none");
        }
      }

      function hideError() {
        state.error = "";
        const errBox = document.getElementById("errBox");
        if (errBox) errBox.classList.add("d-none");
      }

      function renderNumbersUI() {
        const allowedBadges = (state.allowedNumbers || []).map((n) => {
          return `
            <span class="badge badge-num p-2 d-flex align-items-center gap-2 me-2 mb-2">
              <span class="mono">${escapeHtml(n)}</span>
              <button class="btn btn-sm btn-link text-decoration-none text-light p-0 ms-1" data-action="removeAllowed" data-n="${escapeHtml(n)}" type="button">x</button>
            </span>
          `;
        }).join("");

        const phoneRows = (state.phoneMap || []).map((item, i) => {
          return `
            <div class="row g-2 align-items-center mb-2" data-row="${i}">
              <div class="col-5 col-md-6">
                <input class="form-control mono" data-action="editFrom" data-i="${i}" value="${escapeHtml(item.from || "")}" placeholder="from (entrada)" />
              </div>
              <div class="col-5 col-md-5">
                <input class="form-control mono" data-action="editTo" data-i="${i}" value="${escapeHtml(item.to || "")}" placeholder="to (envio)" />
              </div>
              <div class="col-2 col-md-1 text-end">
                <button class="btn btn-outline-light" data-action="removeMap" data-i="${i}" type="button">x</button>
              </div>
            </div>
          `;
        }).join("");

        appEl.innerHTML = `
          <div class="glass p-4">
            <div class="row g-3">
              <div class="col-12 col-lg-6">
                <div class="fw-semibold mb-2">WHATSAPP_ALLOWED_NUMBERS</div>

                <div class="d-flex gap-2 mb-3">
                  <input id="addAllowedInput" class="form-control mono" placeholder="ej: 41794157573" />
                  <button id="addAllowedBtn" class="btn btn-outline-light" type="button">Agregar</button>
                </div>

                <div class="d-flex flex-wrap">
                  ${allowedBadges || `<div class="text-secondary small">Sin numeros.</div>`}
                </div>
              </div>

              <div class="col-12 col-lg-6">
                <div class="fw-semibold mb-2">WHATSAPP_PHONE_MAP (avanzado)</div>

                <div class="d-flex flex-column">
                  ${phoneRows || `<div class="text-secondary small">Sin mapeos.</div>`}
                </div>

                <div class="mt-3">
                  <button id="addMapBtn" class="btn btn-outline-light w-100" type="button">
                    Agregar mapeo
                  </button>
                </div>
              </div>
            </div>

            <div class="d-flex justify-content-end gap-2 mt-4">
              <button id="reloadBtn" class="btn btn-outline-light" type="button" ${state.loading ? "disabled" : ""}>
                Recargar
              </button>
              <button id="saveBtn" class="btn btn-success" type="button" ${state.loading ? "disabled" : ""}>
                Guardar cambios
              </button>
              <button id="logsBtn" class="btn btn-outline-info" type="button" ${state.loading ? "disabled" : ""}>
                Ver últimos mensajes
              </button>
            </div>

            <div id="errBox" class="alert alert-danger mt-3 mb-0 d-none"></div>
          </div>

          <div
            id="logsModal"
            style="
              position: fixed;
              inset: 0;
              background: rgba(0,0,0,0.55);
              display: none;
              z-index: 9999;
            "
          >
            <div
              class="glass"
              style="
                position: absolute;
                left: 50%;
                top: 50%;
                transform: translate(-50%, -50%);
                width: min(980px, calc(100vw - 24px));
                max-height: calc(100vh - 24px);
                overflow: hidden;
              "
            >
              <div class="d-flex align-items-center justify-content-between px-3 py-2 border-bottom" style="border-color: rgba(255,255,255,0.12) !important;">
                <div class="fw-semibold">Últimos mensajes recibidos</div>
                <button id="closeLogsBtn" class="btn btn-sm btn-outline-light" type="button">Cerrar</button>
              </div>
              <div style="padding: 12px;">
                <pre id="logsPre" class="mono" style="margin: 0; white-space: pre-wrap; word-break: break-word; max-height: calc(100vh - 160px); overflow: auto;"></pre>
              </div>
            </div>
          </div>
        `;

        // Allowed add/remove
        const addAllowedInput = document.getElementById("addAllowedInput");
        document.getElementById("addAllowedBtn").addEventListener("click", () => {
          const n = normalizeDigits(addAllowedInput.value);
          if (!n) return;
          state.allowedNumbers = uniq([...(state.allowedNumbers || []), n]);
          addAllowedInput.value = "";
          renderNumbersUI();
        });
        addAllowedInput.addEventListener("keydown", (e) => {
          if (e.key !== "Enter") return;
          e.preventDefault();
          document.getElementById("addAllowedBtn").click();
        });

        appEl.querySelectorAll('[data-action="removeAllowed"]').forEach((btn) => {
          btn.addEventListener("click", () => {
            const n = btn.getAttribute("data-n");
            state.allowedNumbers = (state.allowedNumbers || []).filter((x) => x !== n);
            // también limpiamos mapeos donde from ya no esté permitido (mantenemos regla simple)
            state.phoneMap = (state.phoneMap || []).filter((m) => (state.allowedNumbers || []).includes(m.from));
            renderNumbersUI();
          });
        });

        // Map edit/remove
        appEl.querySelectorAll("[data-action='editFrom']").forEach((inp) => {
          inp.addEventListener("input", () => {
            const i = Number(inp.getAttribute("data-i"));
            const v = normalizeDigits(inp.value);
            state.phoneMap[i].from = v;
          });
        });
        appEl.querySelectorAll("[data-action='editTo']").forEach((inp) => {
          inp.addEventListener("input", () => {
            const i = Number(inp.getAttribute("data-i"));
            const v = normalizeDigits(inp.value);
            state.phoneMap[i].to = v;
          });
        });
        appEl.querySelectorAll("[data-action='removeMap']").forEach((btn) => {
          btn.addEventListener("click", () => {
            const i = Number(btn.getAttribute("data-i"));
            state.phoneMap = (state.phoneMap || []).filter((_, idx) => idx !== i);
            renderNumbersUI();
          });
        });

        document.getElementById("addMapBtn").addEventListener("click", () => {
          state.phoneMap = [...(state.phoneMap || []), { from: "", to: "" }];
          renderNumbersUI();
        });

        document.getElementById("reloadBtn").addEventListener("click", () => fetchConfig());
        document.getElementById("saveBtn").addEventListener("click", () => saveConfig());

        const logsBtn = document.getElementById("logsBtn");
        const logsModal = document.getElementById("logsModal");
        const closeLogsBtn = document.getElementById("closeLogsBtn");
        const logsPre = document.getElementById("logsPre");

        function openLogsModal(text) {
          if (logsPre) logsPre.textContent = text || "";
          if (logsModal) logsModal.style.display = "block";
        }

        function closeLogsModal() {
          if (logsModal) logsModal.style.display = "none";
        }

        if (closeLogsBtn) closeLogsBtn.addEventListener("click", closeLogsModal);
        if (logsModal) {
          logsModal.addEventListener("click", (e) => {
            if (e.target === logsModal) closeLogsModal();
          });
        }

        async function fetchLogs() {
          try {
            const token = (state.token || "").trim();
            if (!token) throw new Error("Falta token");
            if (logsPre) logsPre.textContent = "Cargando...";
            openLogsModal();

            const res = await fetch(`/admin/whatsapp/api/logs?limit=80`, {
              headers: { Authorization: `Bearer ${token}` }
            });
            const js = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(js.error || js.detail || `HTTP ${res.status}`);
            const lines = js.lines || [];
            openLogsModal(lines.join("\\n"));
          } catch (e) {
            openLogsModal(String(e?.message || e));
          }
        }

        if (logsBtn) logsBtn.addEventListener("click", fetchLogs);
      }

      function render() {
        hideError();
        if ((state.token || "").trim()) return renderNumbersUI();
        return renderTokenUI();
      }

      async function fetchConfig() {
        state.loading = true;
        state.error = "";
        hideError();
        render();

        try {
          const token = (state.token || "").trim();
          const res = await fetch("/admin/whatsapp/api/config", {
            headers: { Authorization: `Bearer ${token}` }
          });
          const js = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(js.error || js.detail || `HTTP ${res.status}`);
          state.allowedNumbers = js.allowedNumbers || [];
          state.phoneMap = js.phoneMap || [];
        } catch (e) {
          showError(String(e?.message || e));
        } finally {
          state.loading = false;
          render();
        }
      }

      function buildPayload() {
        let allowed = (state.allowedNumbers || []).map(normalizeDigits).filter(Boolean);
        allowed = uniq(allowed).sort((a, b) => (a < b ? -1 : 1));

        // Validamos mapeos: src/dst con digits y dst libre, src debe quedar permitido
        const phoneMap = (state.phoneMap || [])
          .map((x) => ({ from: normalizeDigits(x.from), to: normalizeDigits(x.to) }))
          .filter((x) => x.from && x.to);

        // Asegurar que cada from del map esté en allowed (regla simple).
        const froms = phoneMap.map((m) => m.from);
        allowed = uniq([...allowed, ...froms]).sort((a, b) => (a < b ? -1 : 1));

        const allowedSet = new Set(allowed);
        const phoneMapFiltered = phoneMap.filter((m) => allowedSet.has(m.from));

        return {
          allowedNumbers: allowed,
          phoneMap: phoneMapFiltered
        };
      }

      async function saveConfig() {
        state.loading = true;
        state.error = "";
        hideError();
        render();

        try {
          const token = (state.token || "").trim();
          if (!token) throw new Error("Falta token");

          const payload = buildPayload();
          const res = await fetch("/admin/whatsapp/api/config", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${token}`
            },
            body: JSON.stringify(payload)
          });
          const js = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(js.error || js.detail || `HTTP ${res.status}`);

          state.allowedNumbers = js.allowedNumbers || payload.allowedNumbers;
          state.phoneMap = js.phoneMap || payload.phoneMap;
        } catch (e) {
          showError(String(e?.message || e));
        } finally {
          state.loading = false;
          render();
        }
      }

      render();
      // Si ya hay token guardado, intentamos cargar.
      if ((state.token || "").trim()) fetchConfig();
    </script>
  </body>
</html>
